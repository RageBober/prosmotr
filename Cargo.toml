[workspace]
members = ["core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Ядро (core) не знает ничего про GUI и собирается за секунды —
# на нём же гоняются тесты. Tauri подключается только в src-tauri.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
