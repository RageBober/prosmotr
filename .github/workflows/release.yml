name: релиз

# Ставим тег — CI собирает пакет и прикладывает его к релизу.
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    name: собрать .deb и выложить
    # 24.04 намеренно: glibc 2.39 и WebKitGTK 2.52 — бинарник пойдёт
    # и на 24.04, и на 26.04. Собери на 26.04 — на 24.04 уже не запустится.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: тесты ядра
        run: cargo test -p prosmotr-core

      - name: собрать пакет
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo tauri build --bundles deb
          cp target/release/prosmotr prosmotr-x86_64

      - name: выложить в релиз
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/release/bundle/deb/*.deb
            prosmotr-x86_64
